# Base PostgreSQL 16 locale pour le développement (aucune donnée réelle).
#   docker compose up -d
# DATABASE_URL="postgresql://postgres:postgres@localhost:5432/tamurt_market?schema=public"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tamurt_market
    ports:
      - "5432:5432"
    volumes:
      - tamurt-market-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tamurt-market-db:
